server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: recover when an API container is recreated with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ~ ^/api/registrations/(participant|staff)$ {
        if ($request_method != POST) { return 405; }
        include /etc/nginx/snippets/registration-api-proxy.conf;
    }

    location ~ ^/api/(turnusy|turnuses)(/staff-options)?$ {
        if ($request_method != GET) { return 405; }
        include /etc/nginx/snippets/registration-api-proxy.conf;
    }

    # Management routes remain reachable only between backend services.
    location /api/ { return 404; }
    location = /api { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
