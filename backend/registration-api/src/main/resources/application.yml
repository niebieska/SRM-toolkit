spring:
  application:
    name: registration-api
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/registration_db}
    username: ${DB_USER:registration_user}
    password: ${DB_PASSWORD:strong_password}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

email:
  service:
    url: ${EMAIL_SERVICE_URL:http://localhost:8082}
  organizer:
    email: ${ORGANIZER_EMAIL:}

registration:
  service:
    username: ${REGISTRATION_SERVICE_USERNAME:biuro-service}
    password: ${REGISTRATION_SERVICE_PASSWORD}
