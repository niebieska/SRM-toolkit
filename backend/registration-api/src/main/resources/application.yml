spring:
  application:
    name: registration-api
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/registration_db}
    username: ${DB_USER:registration_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

email:
  service:
    url: ${EMAIL_SERVICE_URL:http://localhost:8082}
    username: ${EMAIL_SERVICE_USERNAME:registration-email-sender}
    password: ${EMAIL_SERVICE_PASSWORD}
    # Leave headroom inside Biuro's 60-second upstream wait for status updates.
    connect-timeout: ${EMAIL_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${EMAIL_READ_TIMEOUT:PT30S}
  organizer:
    email: ${ORGANIZER_EMAIL:}

registration:
  service:
    username: ${REGISTRATION_SERVICE_USERNAME:biuro-service}
    password: ${REGISTRATION_SERVICE_PASSWORD}

turnus:
  catalogue:
    url: ${BIURO_TURNUS_URL:http://localhost:8081}
    username: ${TURNUS_LOOKUP_USERNAME:registration-turnus-reader}
    password: ${TURNUS_LOOKUP_PASSWORD}
    connect-timeout: ${TURNUS_CONNECT_TIMEOUT:PT15S}
    read-timeout: ${TURNUS_READ_TIMEOUT:PT30S}
    retry-interval: ${TURNUS_RETRY_INTERVAL:PT30S}
    refresh-interval: ${TURNUS_REFRESH_INTERVAL:PT1H}
