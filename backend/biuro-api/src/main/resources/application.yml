server:
  port: ${BIURO_PORT:8081}

turnus:
  lookup:
    username: ${TURNUS_LOOKUP_USERNAME:registration-turnus-reader}
    password: ${TURNUS_LOOKUP_PASSWORD}

biuro:
  bootstrap:
    enabled: ${BIURO_BOOTSTRAP_ENABLED:false}
    username: ${BIURO_BOOTSTRAP_USERNAME:}
    display-name: ${BIURO_BOOTSTRAP_DISPLAY_NAME:}
    password: ${BIURO_BOOTSTRAP_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
    expiry-hours: 2

registration:
  api:
    url: ${REGISTRATION_API_URL:http://localhost:8080}
    read-timeout: PT60S
    username: ${REGISTRATION_SERVICE_USERNAME:biuro-service}
    password: ${REGISTRATION_SERVICE_PASSWORD}

logging:
  level:
    pl.srm.biuroapi: DEBUG

spring:
  datasource:
    url: ${BIURO_DB_URL:jdbc:mariadb://localhost:3306/biuro_db}
    username: ${BIURO_DB_USER:biuro_user}
    password: ${BIURO_DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

staff:
  catalogue:
    location: ${STAFF_CATALOGUE_LOCATION:classpath:staff-seasons/}
