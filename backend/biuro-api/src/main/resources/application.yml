server:
  port: ${BIURO_PORT:8081}

turnus:
  lookup:
    username: ${TURNUS_LOOKUP_USERNAME:registration-turnus-reader}
    password: ${TURNUS_LOOKUP_PASSWORD}

biuro:
  auth:
    username: ${BIURO_USERNAME:biuro}
    password: ${BIURO_PASSWORD:biuro123}
  jwt:
    secret: ${JWT_SECRET:changeme-very-long-secret-key-at-least-32-chars}
    expiry-hours: 8

registration:
  api:
    url: ${REGISTRATION_API_URL:http://localhost:8080}
    username: ${REGISTRATION_SERVICE_USERNAME:biuro-service}
    password: ${REGISTRATION_SERVICE_PASSWORD}

logging:
  level:
    pl.srm.biuroapi: DEBUG

spring:
  datasource:
    url: ${BIURO_DB_URL:jdbc:mariadb://localhost:3306/biuro_db}
    username: ${BIURO_DB_USER:biuro_user}
    password: ${BIURO_DB_PASSWORD:strong_password}
    driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    user:
      name: ignored
