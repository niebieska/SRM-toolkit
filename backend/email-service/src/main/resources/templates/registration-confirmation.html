<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Potwierdzenie zgłoszenia</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1d1d1d; line-height: 1.5;">
<div style="max-width: 640px; margin: 0 auto; padding: 24px; border: 1px solid #e5e5e5; border-radius: 8px;">
    <p>Drogi/Droga <strong th:text="${recipientName}">Uczestniku</strong>,</p>
    <p>Twoje zgłoszenie zostało przyjęte do systemu.</p>

    <div style="margin: 20px 0; padding: 16px; background: #f5f7ff; border-radius: 6px;">
        <p style="margin: 0 0 8px 0;">Kod zgłoszenia:</p>
        <p style="margin: 0; font-size: 22px; font-weight: bold;" th:text="${registrationCode}">UCZ-2026-00042</p>
    </div>

    <p>
        Rodzaj zgłoszenia:
        <strong th:text="${registrationType == 'STAFF' ? 'Kadra' : 'Uczestnik'}">Uczestnik</strong>
    </p>
    <p>Turnus: <strong th:text="${turnusCode}">TURNUS-2026-01</strong></p>
    <p>
        Status:
        <strong th:text="${status == 'NEW' ? 'Nowe' : status}">Nowe</strong>
    </p>

    <p>W razie pytań skontaktuj się z organizatorem.</p>

    <hr style="border: none; border-top: 1px solid #ececec; margin: 24px 0;" />
    <p style="font-size: 12px; color: #6b6b6b; margin: 0;">
        Kontakt: [tu wstaw dane kontaktowe organizatora]
    </p>
</div>
</body>
</html>
