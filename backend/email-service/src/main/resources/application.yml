server:
  port: ${EMAIL_SERVICE_PORT:8082}

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      # Milliseconds per socket operation, not a total delivery deadline.
      mail.smtp.connectiontimeout: ${MAIL_CONNECT_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${MAIL_READ_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}

email:
  service:
    username: ${EMAIL_SERVICE_USERNAME:registration-email-sender}
    password: ${EMAIL_SERVICE_PASSWORD}
  from: ${MAIL_FROM:noreply@srm.pl}
  enabled: ${MAIL_ENABLED:true}
  templates:
    regulations-url: ${EMAIL_REGULATIONS_URL:https://rekolekcje.scj.pl/informacje-organizacyjne/}
    info-url: ${EMAIL_INFO_URL:https://rekolekcje.scj.pl/informacje-organizacyjne/}
    contact-email: ${EMAIL_CONTACT_EMAIL:zgloszenia.rek@scj.pl}
    contact-phone: ${EMAIL_CONTACT_PHONE:+48 602 439 696}
    logo-url: ${EMAIL_LOGO_URL:https://rekolekcje.scj.pl/beta/wp-content/uploads/logo3.png}
    participant-card-adult-url: ${PARTICIPANT_CARD_ADULT_URL:https://rekolekcje.scj.pl/beta/wp-content/uploads/karta2020.pdf}
    participant-card-minor-url: ${PARTICIPANT_CARD_MINOR_URL:https://rekolekcje.scj.pl/beta/wp-content/uploads/karta2020.pdf}
    participant-bank-account: ${PARTICIPANT_BANK_ACCOUNT:}
    participant-deposit-amount: ${PARTICIPANT_DEPOSIT_AMOUNT:}

logging:
  level:
    pl.srm.emailservice: DEBUG
